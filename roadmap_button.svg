  <rect x="5" y="5" width="170" height="36" rx="8" fill="url(#grad)" filter="url(#shadow)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="90" y="28" fill="#ffffff" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" letter-spacing="1.5px">VIEW ROADMAP</text>
