<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #0d1117; }
            .stage-box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8; }
            .stage-title { fill: #8b949e; font-family: sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 2px; }
            .module { fill: #21262d; stroke: #8b949e; stroke-width: 2; rx: 4; }
            .module-text { fill: #c9d1d9; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
            .line { stroke: #58a6ff; stroke-width: 2; fill: none; }
            .arrow { fill: #58a6ff; }
            .ctrl-line { stroke: #ff7b72; stroke-width: 2; stroke-dasharray: 4; fill: none; }
            .ctrl-arrow { fill: #ff7b72; }
            .pipe-reg { fill: #1f6feb; rx: 2; }
        </style>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
        </marker>
        <marker id="ctrl-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="ctrl-arrow" />
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="600" class="bg" />

    <!-- Stage Backgrounds -->
    <rect x="50" y="50" width="200" height="500" class="stage-box" />
    <text x="150" y="80" text-anchor="middle" class="stage-title">FETCH (IF)</text>
    
    <rect x="280" y="50" width="200" height="500" class="stage-box" />
    <text x="380" y="80" text-anchor="middle" class="stage-title">DECODE (ID)</text>
    
    <rect x="510" y="50" width="200" height="500" class="stage-box" />
    <text x="610" y="80" text-anchor="middle" class="stage-title">EXECUTE (EX)</text>
    
    <rect x="740" y="50" width="200" height="500" class="stage-box" />
    <text x="840" y="80" text-anchor="middle" class="stage-title">MEMORY (MEM)</text>

    <rect x="970" y="50" width="200" height="500" class="stage-box" />
    <text x="1070" y="80" text-anchor="middle" class="stage-title">WRITEBACK (WB)</text>

    <!-- Pipeline Registers -->
    <rect x="260" y="100" width="10" height="400" class="pipe-reg" />
    <rect x="490" y="100" width="10" height="400" class="pipe-reg" />
    <rect x="720" y="100" width="10" height="400" class="pipe-reg" />
    <rect x="950" y="100" width="10" height="400" class="pipe-reg" />

    <!-- Modules in Fetch -->
    <rect x="80" y="120" width="140" height="50" class="module" />
    <text x="150" y="145" class="module-text">PC / Next PC</text>

    <rect x="80" y="220" width="140" height="60" class="module" />
    <text x="150" y="250" class="module-text">Instruction MMU</text>

    <rect x="80" y="330" width="140" height="80" class="module" />
    <text x="150" y="370" class="module-text">System Memory</text>

    <!-- Modules in Decode -->
    <rect x="310" y="140" width="140" height="60" class="module" />
    <text x="380" y="170" class="module-text">Decoder &amp; Control</text>

    <rect x="310" y="250" width="140" height="100" class="module" />
    <text x="380" y="300" class="module-text">Register File</text>

    <!-- Modules in Execute -->
    <rect x="540" y="120" width="140" height="80" class="module" />
    <text x="610" y="160" class="module-text">ALU</text>

    <rect x="540" y="240" width="140" height="60" class="module" />
    <text x="610" y="270" class="module-text">Branch Unit</text>

    <rect x="540" y="340" width="140" height="60" class="module" />
    <text x="610" y="370" class="module-text">CSR (Trap/Int)</text>

    <rect x="540" y="440" width="140" height="50" class="module" />
    <text x="610" y="465" class="module-text">Forwarding/Hazard</text>

    <!-- Modules in Memory -->
    <rect x="770" y="150" width="140" height="60" class="module" />
    <text x="840" y="180" class="module-text">Data MMU</text>

    <rect x="770" y="270" width="140" height="80" class="module" />
    <text x="840" y="310" class="module-text">LSU (Mem Access)</text>

    <!-- Modules in Writeback -->
    <rect x="1000" y="250" width="140" height="60" class="module" />
    <text x="1070" y="280" class="module-text">WB Mux</text>

    <!-- Datapath Lines -->
    <!-- IF -->
    <path d="M 150 170 L 150 220" class="line" marker-end="url(#arrowhead)" />
    <path d="M 150 280 L 150 330" class="line" marker-end="url(#arrowhead)" />
    <path d="M 220 370 L 260 370" class="line" marker-end="url(#arrowhead)" />

    <!-- ID -->
    <path d="M 270 170 L 310 170" class="line" marker-end="url(#arrowhead)" />
    <path d="M 270 300 L 310 300" class="line" marker-end="url(#arrowhead)" />
    <path d="M 450 170 L 490 170" class="line" marker-end="url(#arrowhead)" />
    <path d="M 450 300 L 490 300" class="line" marker-end="url(#arrowhead)" />

    <!-- EX -->
    <path d="M 500 160 L 540 160" class="line" marker-end="url(#arrowhead)" />
    <path d="M 500 270 L 540 270" class="line" marker-end="url(#arrowhead)" />
    <path d="M 680 160 L 720 160" class="line" marker-end="url(#arrowhead)" />

    <!-- MEM -->
    <path d="M 730 180 L 770 180" class="line" marker-end="url(#arrowhead)" />
    <path d="M 840 210 L 840 270" class="line" marker-end="url(#arrowhead)" />
    <path d="M 910 310 L 950 310" class="line" marker-end="url(#arrowhead)" />

    <!-- WB -->
    <path d="M 960 280 L 1000 280" class="line" marker-end="url(#arrowhead)" />
    
    <!-- Forwarding / Loopbacks -->
    <path d="M 1070 250 L 1070 20 L 400 20 L 400 250" class="line" marker-end="url(#arrowhead)" />
    <text x="735" y="15" fill="#58a6ff" font-family="sans-serif" font-size="12px">Register Writeback</text>
    
    <!-- Control Lines (Hazards, Branch Redirect) -->
    <path d="M 610 240 L 610 30 L 150 30 L 150 120" class="ctrl-line" marker-end="url(#ctrl-arrowhead)" />
    <text x="380" y="45" fill="#ff7b72" font-family="sans-serif" font-size="12px">Branch / Jump Target (PC Redirect)</text>
    
    <path d="M 610 340 L 610 220" class="ctrl-line" marker-end="url(#ctrl-arrowhead)" />
    <path d="M 540 465 L 515 465 L 515 110 L 175 110 L 175 120" class="ctrl-line" marker-end="url(#ctrl-arrowhead)" />
    <text x="380" y="105" fill="#ff7b72" font-family="sans-serif" font-size="12px">Stall / Flush (Control Hazard Unit)</text>
    
</svg>